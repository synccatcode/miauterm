name: Build Miauterm APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install rootfs test tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-35" "ndk;26.1.10909125" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager failed at attempt $attempt" >&2
            sleep 20
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Verify Debian commands and default home creation
        run: bash scripts/verify-rootfs.sh --net
      - name: Test terminal and Debian runtime
        run: gradle --no-daemon :app:testDebugUnitTest --tests org.cortex.terminal.view.ExtraKeysLayoutTest --tests org.cortex.terminal.view.ExtraKeysConfigTest --tests org.cortex.terminal.view.ExtraKeysViewTest --tests org.cortex.terminal.view.TerminalInterfaceTest --tests org.cortex.terminal.session.SessionPromptTest --tests org.cortex.terminal.runtime.SharedFolderAccessTest --tests org.cortex.terminal.runtime.DebianRuntimeRootfsTest --tests org.cortex.terminal.runtime.DebianRuntimeDnsTest --tests org.cortex.terminal.runtime.MiautermCommandInstallerTest --tests org.cortex.terminal.api.ApiProtocolTest
      - name: Build installable arm64 APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name the APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/Miauterm-arm64-debug.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1 | xargs dirname)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          unzip -t "$APK"
          EXPECTED_ROOTFS_SHA="$(sha256sum app/src/main/assets/debian-arm64.tar.zst | cut -d ' ' -f 1)"
          PACKAGED_ROOTFS_SHA="$(unzip -p "$APK" assets/debian-arm64.tar.zst | sha256sum | cut -d ' ' -f 1)"
          test "$PACKAGED_ROOTFS_SHA" = "$EXPECTED_ROOTFS_SHA"
          (cd dist && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          printf 'Extract this GitHub Actions artifact ZIP first, then install Miauterm-arm64-debug.apk.\n' > dist/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: miauterm-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.ref_type == 'tag'
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install rootfs test tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-35" "ndk;26.1.10909125" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager failed at attempt $attempt" >&2
            sleep 20
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Verify Debian commands and default home creation
        run: bash scripts/verify-rootfs.sh
      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/miauterm-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and package direct APK download
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          OUT="dist/Miauterm-${GITHUB_REF_NAME}-arm64.apk"
          cp "$APK" "$OUT"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1 | xargs dirname)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$OUT"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | grep -F "package: name='com.miauterm.terminal'"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | grep -F "application-label:'Miauterm'"
          unzip -t "$OUT"
          EXPECTED_ROOTFS_SHA="$(sha256sum app/src/main/assets/debian-arm64.tar.zst | cut -d ' ' -f 1)"
          PACKAGED_ROOTFS_SHA="$(unzip -p "$OUT" assets/debian-arm64.tar.zst | sha256sum | cut -d ' ' -f 1)"
          test "$PACKAGED_ROOTFS_SHA" = "$EXPECTED_ROOTFS_SHA"
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
      - name: Download the debug APK built above
        uses: actions/download-artifact@v8
        with:
          name: miauterm-debug-apk
          path: debug-dist
      - name: Publish APKs and checksums to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FILES=(dist/*.apk dist/*.sha256)
          if [ -d debug-dist ]; then
            RELEASE_FILES+=(debug-dist/Miauterm-arm64-debug.apk debug-dist/Miauterm-arm64-debug.apk.sha256)
          fi
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE" --latest --title "Miauterm $GITHUB_REF_NAME"
            else
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --title "Miauterm $GITHUB_REF_NAME"
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE" --latest --title "Miauterm $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --generate-notes --latest --title "Miauterm $GITHUB_REF_NAME"
          fi
